name: Publish audited report website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'catalog.json'
      - 'README.md'
      - 'AGENTS.md'
      - '.nojekyll'
      - 'reports/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive-entropy regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check dashboard and verifier syntax
        run: |
          node --check assets/dashboard.js
          python3 -m py_compile scripts/verify_pages.py scripts/verify_dashboard_browser.py
      - name: Reject stale indexes and broken report archives
        run: |
          python3 scripts/build_catalog.py --check
          python3 scripts/audit.py
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html catalog.json README.md AGENTS.md .nojekyll _site/
          cp -R assets _site/assets
          cp -R reports _site/reports
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test real public website and report SHA-256
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/verify_pages.py --site-url "${{ steps.deployment.outputs.page_url }}" --attempts 15 --interval 8
      - name: Ensure real CJK fonts for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
      - name: Verify browser-rendered report and capture screenshot
        run: |
          python3 scripts/verify_dashboard_browser.py --site-url "${{ steps.deployment.outputs.page_url }}" --screenshot "$RUNNER_TEMP/cron-news-dashboard.png"
      - name: Upload visual QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: pages-rendered-dashboard
          path: ${{ runner.temp }}/cron-news-dashboard.png
          retention-days: 7
